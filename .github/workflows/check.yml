name: Check

# Pull requests (and manual runs):
# - Linux: builds the bridge with mingw-w64 and the Linux CLAP with gcc, runs the bridge tests under Wine
#   (bridge/test/run_tests.sh: both Windows directions, the Linux CLAP with a 32-bit and a 64-bit plugin, the macOS
#   variant of the CLAP built on Linux) and checks the patcher from source (syntax, --selftest, --cli as the Windows
#   and as the Linux patcher).
# - macOS: builds the universal CLAP, freezes the patcher like the release (--selftest must see arm64 + x86_64), lets
#   it write a .clap bundle, verifies the signature and loads the bundle (without Wine: entry and factory only).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Bridge tests (Wine) and patcher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # no recommends: they pull in hundreds of MB (fonts, GStreamer ...) the tests do not need
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64 libxcb1-dev wine wine64 wine32:i386 xvfb xauth

      - name: Initialise Wine
        timeout-minutes: 5
        run: xvfb-run -a wine wineboot -i

      - name: Bridge tests
        timeout-minutes: 10
        run: bash bridge/test/run_tests.sh

      - name: Patcher
        run: |
          set -euo pipefail
          python3 -m py_compile patcher.py patcher_i18n.py utility/*.py
          python3 patcher.py --selftest
          VB_TEST_SYSTEM=windows python3 patcher.py --selftest
          T="$(mktemp -d)"; mkdir -p "$T/Input/sub"
          i686-w64-mingw32-gcc -O2 -Ibridge -shared -o "$T/Input/plug32.dll" bridge/test/fakevst.c -static-libgcc -s
          x86_64-w64-mingw32-gcc -O2 -Ibridge -shared -o "$T/Input/sub/plug64.dll" bridge/test/fakevst.c -static-libgcc -s
          mkdir -p fake && cp "$T/Input/plug32.dll" fake/        # for the macOS job
          cp -r "$T/Input" "$T/Win"
          echo "== as the Windows patcher"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win" --output "$T/WinOut"
          O="$T/WinOut"
          test -f "$O/plug32.dll" && test -f "$O/plug32_x64.dll" && test -f "$O/plug32_x64.clap" && test -f "$O/vst2bridge-host32.exe"
          test -f "$O/plug64.dll" && test -f "$O/plug64_x86.dll" && test -f "$O/plug64_x86.clap" && test -f "$O/vst2bridge-host64.exe"
          test ! -e "$T/Win/plug32_x64.dll"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win" --output "$O" | grep -c current | grep -qx 2
          echo "== Windows output formats"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win" --output "$T/V" --format vst2
          test -f "$T/V/plug32_x64.dll" && test ! -e "$T/V/plug32_x64.clap"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win" --output "$T/C" --format clap
          test -f "$T/C/plug32_x64.clap" && test ! -e "$T/C/plug32_x64.dll"
          echo "== as the Linux patcher (CLAP only)"
          python3 patcher.py --cli "$T/Input" --output "$T/LinOut"
          test -f "$T/LinOut/plug32.dll" && test -f "$T/LinOut/plug32.clap" && test -f "$T/LinOut/vst2bridge-host32.exe" && test ! -e "$T/LinOut/plug32_x64.dll"
          test -f "$T/LinOut/plug64.clap" && test -f "$T/LinOut/vst2bridge-host64.exe"
          python3 patcher.py --cli "$T/Input" --output "$T/LinOut" | grep -c current | grep -qx 2

      - name: Stop Wine
        if: always()
        run: wineserver -k || true          # leftover Wine processes make the job hang in its cleanup

      - name: Upload helpers and test plugin (macOS job)
        uses: actions/upload-artifact@v4
        with:
          name: check-bin
          path: |
            bridge/vst2bridge-host32.exe
            bridge/vst2bridge-host64.exe
            fake/plug32.dll
          if-no-files-found: error

  macos:
    name: macOS CLAP and patcher
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download helpers and test plugin
        uses: actions/download-artifact@v4
        with:
          name: check-bin
          path: dl

      - name: Build
        run: |
          set -euo pipefail
          make -C bridge macos
          lipo -info bridge/vst2bridge-macos
          clang -O2 -Wall -Ibridge -o smoke bridge/test/smoke.c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze the patcher like the release, self test, write a bundle and load it
        run: |
          set -euo pipefail
          mkdir bin
          cp dl/bridge/vst2bridge-host32.exe dl/bridge/vst2bridge-host64.exe bin/
          gzip -9 -c bridge/vst2bridge-macos > bin/vst2bridge-macos.gz   # gzipped: PyInstaller would thin a bare Mach-O file
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --windowed --noconfirm --clean --name VST2Bridge-Patcher \
            --icon utility/icons/patcher.icns --add-data "utility/icons:icons" \
            --paths utility --paths . --add-data "bin:bin" --add-data "docs/versions.md:docs" \
            --hidden-import patcher_i18n --hidden-import bridges --hidden-import pe --hidden-import selfupdate patcher.py
          P=dist/VST2Bridge-Patcher.app/Contents/MacOS/VST2Bridge-Patcher
          "$P" --selftest
          mkdir -p t && cp dl/fake/plug32.dll t/
          "$P" --cli "$PWD/t" --output "$PWD/o"
          find o
          codesign --verify --verbose o/plug32.clap
          ./smoke o/plug32.clap/Contents/MacOS/plug32 "$PWD/o/plug32.clap"
          ./smoke o/plug32.clap/Contents/MacOS/plug32
          "$P" --cli "$PWD/t" --output "$PWD/o" | grep -q current
